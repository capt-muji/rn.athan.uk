apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.widgetrefresh'
version = '0.1.0'

android {
    namespace "expo.modules.widgetrefresh"

    compileSdk 37

    defaultConfig {
        minSdk 24
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':expo-modules-core')
    // Pinned to the version expo-background-task already resolves, so the
    // app's dependency graph is unchanged by the watchdog.
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
