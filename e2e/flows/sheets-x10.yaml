appId: com.example.athan
name: sheets-x10
tags:
  - baseline
---
# Settings + alert sheet open/close cadence suite (OnePlus 3T pixels).
# appId is the literal dev package id: maestro 2.10.0 no longer substitutes
# ${APP_ID} from the environment, so a committed flow carrying it launches
# no app and can drive the wrong package through the dock.
# Tap points read from the live tree 2026-10-25 (settings button 539,1833;
# alert bell on the prayer row 979,1012): re-verify with Maestro `hierarchy`
# before driving — Android 9 AX dumps are stale, and points drift with layout
# changes.
# BACK dismisses a sheet; BACK with no sheet open EXITS the app.
- repeat:
    times: 10
    commands:
      - tapOn:
          point: '539, 1833'
      - waitForAnimationToEnd:
          timeout: 2500
      - pressKey: back
      - waitForAnimationToEnd:
          timeout: 2500
- repeat:
    times: 10
    commands:
      - tapOn:
          point: '979, 1012'
      - waitForAnimationToEnd:
          timeout: 2500
      - pressKey: back
      - waitForAnimationToEnd:
          timeout: 2500
- assertVisible: 'London, UK'
