appId: com.example.athan
name: swipes-x15
tags:
  - baseline
---
# appId is the literal dev package id: maestro 2.10.0 does not substitute
# ${APP_ID} from the environment (probed 2026-11-04: an exported var, even
# MAESTRO_-prefixed, reaches no appId field), so a committed flow carrying it
# launches no app and can drive the wrong package through the dock.
# Pager swipe cadence suite (std <-> extras). Swipes at 21% height avoid the
# prayer rows and the countdown bar.
- repeat:
    times: 15
    commands:
      - swipe:
          start: '80%, 21%'
          end: '20%, 21%'
          duration: 250
      - extendedWaitUntil:
          visible: 'Midnight'
          timeout: 4000
      - swipe:
          start: '20%, 21%'
          end: '80%, 21%'
          duration: 250
      - extendedWaitUntil:
          visible: 'Fajr'
          timeout: 4000
