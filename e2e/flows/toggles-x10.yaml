appId: com.example.athan
name: toggles-x10
tags:
  - baseline
---
# appId is the literal dev package id: maestro 2.10.0 does not substitute
# ${APP_ID} from the environment (probed 2026-11-04: an exported var, even
# MAESTRO_-prefixed, reaches no appId field), so a committed flow carrying it
# launches no app and can drive the wrong package through the dock.
# Toggle write-path suite. "Show seconds" (540,1570) flips ON then OFF each
# iteration — final state restored; verify from pixels, never toggle history.
- tapOn:
    point: '540, 1730'
- waitForAnimationToEnd:
    timeout: 2500
- repeat:
    times: 10
    commands:
      - tapOn:
          point: '540, 1570'
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          point: '540, 1570'
      - waitForAnimationToEnd:
          timeout: 1500
- pressKey: back
- assertVisible: 'London, UK'
