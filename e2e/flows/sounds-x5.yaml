appId: com.mugtaba.athan
name: sounds-x5
tags:
  - baseline
---
# Sound sheet suite (OnePlus 3T pixels): open over settings ("Change athan"
# row 540,1138), select row 2 then re-select row 1 (selection restored),
# play/pause row 1 (play icon 930,975), dismiss. One BACK per open sheet.
- tapOn:
    point: '540, 1730'
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    point: '540, 1138'
- waitForAnimationToEnd:
    timeout: 2500
- repeat:
    times: 5
    commands:
      - tapOn:
          point: '270, 1139'
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          point: '270, 974'
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          point: '930, 975'
      - waitForAnimationToEnd:
          timeout: 3000
- pressKey: back
- waitForAnimationToEnd:
    timeout: 1500
- pressKey: back
- assertVisible: 'London, UK'
