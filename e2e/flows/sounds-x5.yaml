appId: com.mugtaba.athan
name: sounds-x5
tags:
  - baseline
---
# Sound sheet suite (OnePlus 3T pixels): open settings, then "Change athan"
# (row 540,1138) — which closes settings and opens the sound sheet in the same
# tick, so only ONE sheet is open from here on. Select row 2 then re-select
# row 1 (selection restored), play/pause row 1 (play icon 930,975), dismiss
# with exactly one BACK (a second BACK exits the app to the launcher).
- tapOn:
    point: '540, 1730'
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    point: '540, 1138'
- waitForAnimationToEnd:
    timeout: 2500
- repeat:
    times: 5
    commands:
      - tapOn:
          point: '270, 1139'
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          point: '270, 974'
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          point: '930, 975'
      - waitForAnimationToEnd:
          timeout: 3000
- pressKey: back
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible: 'London, UK'
