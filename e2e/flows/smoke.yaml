appId: com.example.athan
name: smoke
tags:
  - baseline
---
# appId is the literal dev package id: maestro 2.10.0 does not substitute
# ${APP_ID} from the environment (probed 2026-11-04: an exported var, even
# MAESTRO_-prefixed, reaches no appId field), so a committed flow carrying it
# launches no app and can drive the wrong package through the dock.
- launchApp
- extendedWaitUntil:
    visible: 'London, UK'
    timeout: 15000
