appId: com.mugtaba.athan
name: android15-edge-to-edge
tags:
  - android15
---
# Android 15 (API 35) proof, where the platform ENFORCES edge-to-edge: the app draws, the overlay
# opens on a row, and the back press closes it without leaving the app.
# Targets are found by text rather than by pixel, so this flow is device-agnostic: the 3T flows
# beside it are pinned to its 1080x1920 panel and cannot run here.
#
# STATUS: not yet green end to end on an arm64 Android 15 AVD. Maestro's driver times out on that
# image far more often than it starts, and when it does start it reaches the settings tap, so every
# step below has passed. The alignment proof does NOT depend on this flow: it was measured from the
# live accessibility tree and is recorded in ai/plans/35-housekeeping/ANDROID15-PROOF.md.
# No launchApp: on a DEBUG build that restarts into the dev launcher, which needs a Metro pick.
# The app is already foregrounded by the caller; a release build can add `- launchApp` above this.
- extendedWaitUntil:
    visible: 'London, UK'
    timeout: 30000

# The list drew under the enforced edge-to-edge window
- assertVisible: 'Fajr'
- assertVisible: 'Dhuhr'
- assertVisible: 'Isha'

# The overlay opens on a tapped row
- tapOn: 'Dhuhr'
- waitForAnimationToEnd:
    timeout: 2500

# Back closes the overlay and keeps the app open, which is the rule this session added
- pressKey: back
- waitForAnimationToEnd:
    timeout: 2500
- assertVisible: 'London, UK'
- assertVisible: 'Fajr'

# The sheet's own back handling is covered by components/sheets/parts/__tests__/Sheet.test.tsx and
# was confirmed on this emulator by hand (sheet closed, app survived). It is NOT asserted here: the
# settings button is icon-only, and Maestro's tree does not carry its accessibilityLabel on this
# Android 15 image, so a tapOn would fail for a reader limitation rather than an app defect.
